<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Product Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2e6ff;
            text-align: center;
            padding-top: 100px;
        }

        .product-card {
            background-color: white;
            width: 300px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px gray;
        }

        h1 {
            color: darkblue;
        }

        .price {
            color: #c2185b;
            font-size: 24px;
            font-weight: bold;
            margin: 20px;
        }

        button {
            background-color: teal;
            color: white;
            border: none;
            padding: 12px 25px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkgreen;
        }
    </style>
</head>

<body>

    <div class="product-card">

        <h1>Laptop</h1>

        <p>High Performance Laptop</p>

        <div class="price">₹45,000</div>

        <button onclick="alert('Product Purchased Successfully!')">
            Buy Now
        </button>

    </div>

</body>
</html>
