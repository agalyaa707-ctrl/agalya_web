<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Menu</title>
    <style>
        body {
            background-color: lightyellow;
            font-family: Arial;
        }

        .menu {
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;
            border: 2px solid brown;
        }

        h1 {
            text-align: center;
            color: brown;
        }

        .item {
            padding: 15px;
            border-bottom: 1px solid gray;
        }

        .price {
            float: right;
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="menu">
        <h1>Restaurant Menu</h1>

        <div class="item">
            Idly
            <span class="price">₹40</span>
        </div>

        <div class="item">
            Dosa
            <span class="price">₹60</span>
        </div>

        <div class="item">
            Meals
            <span class="price">₹100</span>
        </div>

        <div class="item">
            Fried Rice
            <span class="price">₹120</span>
        </div>
    </div>

</body>
</html>
