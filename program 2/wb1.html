
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Event Invitation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5e6f7;
            text-align: center;
            padding: 50px;
        }

        .invitation {
            background-color: white;
            width: 600px;
            max-width: 90%;
            margin: auto;
            padding: 40px;
            border: 3px solid #c2185b;
            border-radius: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: #c2185b;
        }

        h2 {
            color: darkblue;
        }

        p {
            color: #444444;
            font-size: 18px;
        }

        .details {
            background-color: #f3e5f5;
            padding: 20px;
            margin: 20px 0;
            font-size: 18px;
            line-height: 2;
        }

        button {
            background-color: #c2185b;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #880e4f;
        }
    </style>
</head>

<body>

    <div class="invitation">

        <h1> Annual Celebration </h1>

        <h2>You Are Invited!</h2>

        <p>
            Join us for an evening of
            <b>fun, music and celebration.</b>
        </p>

        <div class="details">
             <b>Date:</b> 20 October 2026<br>
             <b>Time:</b> 6:00 PM<br>
             <b>Venue:</b> City Auditorium
        </div>

        <button onclick="alert('Thank you for registering!')">
            Register Now
        </button>

    </div>

</body>

</html>
